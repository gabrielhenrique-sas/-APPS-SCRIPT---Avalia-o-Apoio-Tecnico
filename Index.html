<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root { color-scheme:light; --tinta:#17212B; --mudo:#55616D; --primario:#0E5A6B; --primario-esc:#0A404D; --destaque:#0E5A6B; --titulo:#0A404D; --topo:#0A404D;
  --primclaro:#E1EFF2; --fundo:#BCC8D0; --card:#fff; --card2:#F7F9FA; --campo:#fff; --borda:#C8D0D7; --bordasec:#A9C7CE; --linha:#DDE3E8; --faixa:#B5BFC8;
  --navtxt:#CFE3E8; --navbg:#fff; --navtx:#0A404D; --tagbg:#E8ECEF; --tagtx:#37424D; --semb:#E3EAF7; --semt:#2B4A8B; --sombra:rgba(23,33,43,.16);
  --ok:#1B7A4B; --okbg:#E2F4EA; --erro:#B42318; --errobg:#FDE8E6; --aviso:#8A5A00; --avbg:#FFF3D6; --of:#6B3FA0; --ofbg:#EFE8FA; }
:root[data-theme="dark"] { color-scheme:dark; --tinta:#E6E8EB; --mudo:#9AA3AD; --primario:#1F7F95; --primario-esc:#176B7E; --destaque:#5CC0D4; --titulo:#8FD3E1; --topo:#15171A;
  --primclaro:#17353D; --fundo:#0A0B0D; --card:#1A1C20; --card2:#212429; --campo:#121417; --borda:#3A3F46; --bordasec:#3F6F7B; --linha:#2C3036; --faixa:#4A5058;
  --navtxt:#9AA3AD; --navbg:#2A2E34; --navtx:#fff; --tagbg:#2B2F35; --tagtx:#C9CED4; --semb:#1E2B4A; --semt:#9DB8F5; --sombra:rgba(0,0,0,.55);
  --ok:#6FD79C; --okbg:#12301F; --erro:#FF9A90; --errobg:#3A1815; --aviso:#F2C14E; --avbg:#35290A; --of:#C7A9F2; --ofbg:#2B2140; }
* { box-sizing:border-box; }
body { margin:0; font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif; font-size:15px; line-height:1.45; color:var(--tinta); background:var(--fundo); }
header.topo { background:var(--topo); border-bottom:1px solid var(--linha); color:#fff; padding:14px 28px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
header.topo h1 { font-size:18px; margin:0; font-weight:600; }
nav { display:flex; gap:6px; }
nav button { background:none; border:0; color:var(--navtxt); padding:8px 16px; border-radius:999px; cursor:pointer; font:inherit; font-size:14px; }
nav button:hover { background:rgba(255,255,255,.1); }
nav button.ativa { background:var(--navbg); color:var(--navtx); font-weight:700; }
.badge { background:#F5B301; color:var(--tinta); border-radius:10px; padding:1px 7px; font-size:11px; font-weight:700; }
main { max-width:1080px; margin:28px auto; padding:0 18px; }
.card { background:var(--card); border:1px solid var(--linha); border-radius:14px; padding:20px 24px; margin-bottom:24px; box-shadow:0 1px 3px var(--sombra); }
h2 { font-size:17px; color:var(--titulo); margin:0 0 10px; }
button.b, a.b { background:var(--primario); color:#fff; border:1px solid var(--primario); border-radius:8px; padding:9px 16px; cursor:pointer; font:inherit; font-size:13.5px; font-weight:600; text-decoration:none; display:inline-block; }
button.b:hover, a.b:hover { background:var(--primario-esc); border-color:var(--primario-esc); }
button.b.sec, a.b.sec { background:var(--card); color:var(--destaque); border-color:var(--bordasec); }
button.b.sec:hover, a.b.sec:hover { background:var(--primclaro); }
button.b:disabled { opacity:.5; cursor:default; }
:focus-visible { outline:3px solid #7FB8C4; outline-offset:2px; }
a { color:var(--destaque); }
input[type=text], input[type=date], input[type=email], input[type=number], select, textarea { width:100%; padding:9px 11px; border:1px solid var(--borda); border-radius:8px; font:inherit; background:var(--campo); color:var(--tinta); }
textarea { min-height:140px; resize:vertical; }
label { font-size:12.5px; color:var(--mudo); display:block; margin:10px 0 4px; }
label.inline { display:inline-flex; align-items:center; gap:8px; margin:0; color:var(--tinta); font-size:13px; }
label.inline input { width:auto; }
.msg { padding:12px 16px; border-radius:10px; margin-bottom:14px; font-size:14px; }
.msg.erro { background:var(--errobg); color:var(--erro); } .msg.ok { background:var(--okbg); color:var(--ok); } .msg.aviso { background:var(--avbg); color:var(--aviso); }
.semana-barra { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
.semana-titulo { font-size:20px; font-weight:700; color:var(--titulo); text-align:center; }
.semana-ir { display:flex; align-items:center; justify-content:center; gap:12px; flex-wrap:wrap; margin-top:16px; padding-top:16px; border-top:1px solid var(--linha); }
.semana-ir input[type=date] { width:auto; }
table { width:100%; border-collapse:collapse; }
th { text-align:left; font-size:12px; color:var(--mudo); padding:8px; border-bottom:1px solid var(--linha); font-weight:600; }
td { padding:10px 8px; border-bottom:1px solid var(--linha); vertical-align:middle; }
.tag { display:inline-block; font-size:12px; padding:2px 10px; border-radius:999px; background:var(--tagbg); color:var(--tagtx); font-weight:600; }
.tag.of { background:var(--ofbg); color:var(--of); } .tag.ok { background:var(--okbg); color:var(--ok); } .tag.parc { background:var(--avbg); color:var(--aviso); }
.tag.mod { background:var(--primclaro); color:var(--titulo); } .tag.sem { background:var(--semb); color:var(--semt); }
.suave { color:var(--mudo); font-size:12.5px; } .erro-t { color:var(--erro); font-size:12.5px; }
.acoes { margin-top:14px; display:flex; gap:10px; flex-wrap:wrap; }
.grade { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:0 16px; }
.checks { display:flex; gap:16px; flex-wrap:wrap; margin:4px 0 10px; }
.revisar { border:1px solid var(--linha); border-left:5px solid #F5B301; border-radius:12px; padding:16px 18px; margin-bottom:18px; }
.fundo { position:fixed; inset:0; background:rgba(15,25,35,.5); display:none; align-items:flex-start; justify-content:center; overflow:auto; padding:28px 12px; z-index:10; }
.fundo.aberto { display:flex; }
.modal { background:var(--card); border-radius:14px; padding:22px 26px; width:100%; max-width:900px; }
iframe { width:100%; height:420px; border:1px solid var(--linha); border-radius:8px; }
.switch { color:var(--tinta); display:flex; align-items:center; gap:10px; font-size:15px; font-weight:700; }
.switch input { width:20px; height:20px; }
.carregando { color:var(--mudo); padding:28px; text-align:center; }
/* atividades */
.sec-tit { margin:32px 2px 16px; } .sec-tit h2 { font-size:19px; margin-bottom:4px; }
.lista { display:flex; flex-direction:column; gap:28px; }
.ativ { background:var(--card); border:1px solid var(--linha); border-left:6px solid var(--faixa); border-radius:14px; box-shadow:0 2px 8px var(--sombra); overflow:hidden; }
.ativ.parcial { border-left-color:#E0A100; } .ativ.completo { border-left-color:var(--ok); }
.ativ-topo { display:flex; gap:20px; align-items:flex-start; flex-wrap:wrap; padding:22px 26px; background:var(--card2); border-bottom:1px solid var(--linha); }
.data { width:68px; text-align:center; background:var(--primclaro); color:var(--titulo); border-radius:12px; padding:9px 4px; line-height:1.15; }
.data b { display:block; font-size:28px; } .data span { display:block; font-size:13px; font-weight:600; } .data small { display:block; font-size:11px; opacity:.8; }
.ativ-tit { flex:1 1 260px; min-width:0; } .ativ-tit .tags { display:flex; gap:6px; flex-wrap:wrap; }
.ativ-tit h3 { margin:8px 0 2px; font-size:20px; line-height:1.25; }
.ativ-lado { display:flex; flex-direction:column; align-items:flex-end; gap:8px; min-width:180px; }
.tot b { font-size:28px; color:var(--destaque); line-height:1; margin-right:4px; }
.gers { list-style:none; margin:0; padding:4px 26px 8px; }
.ger { display:grid; grid-template-columns:minmax(130px,1.1fr) 120px minmax(170px,1.5fr) 110px 140px; gap:8px 18px; align-items:center; padding:16px 0; border-top:1px solid var(--linha); }
.ger:first-child { border-top:0; }
.ger .nome { font-weight:700; } .ger .acao { text-align:right; }
.ger.geral { background:var(--card2); margin:0 -26px; padding:16px 26px; border-top:2px solid var(--linha); }
.ger.enviado .nome::before { content:"✔ "; color:var(--ok); }
@media (max-width:820px) { .ger { grid-template-columns:1fr 1fr; } .ger .acao { text-align:left; } .ativ-lado { align-items:flex-start; } header.topo { padding:12px 16px; } }
.topo-dir { display:flex; align-items:center; gap:10px; }
button.tema { background:rgba(255,255,255,.12); border:0; color:#fff; width:38px; height:38px; border-radius:50%; cursor:pointer; font-size:17px; line-height:1; }
button.tema:hover { background:rgba(255,255,255,.24); }
.fundo.carga { align-items:center; z-index:30; }
.modal-carga { background:var(--card); border-radius:16px; padding:28px 30px; width:100%; max-width:440px; box-shadow:0 10px 40px rgba(0,0,0,.4); }
.modal-carga h2 { margin-bottom:18px; }
.barra { height:12px; background:var(--linha); border-radius:999px; overflow:hidden; }
#carga-bar { height:100%; width:0; background:var(--destaque); border-radius:999px; transition:width .3s ease; }
.carga-info { display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-top:12px; font-size:14px; }
#carga-pct { font-size:22px; color:var(--destaque); }
@media (prefers-reduced-motion:reduce) { #carga-bar { transition:none; } }
</style>
</head>
<body>
<header class="topo">
  <h1>Relatórios de Avaliação do Apoio Técnico</h1>
  <div class="topo-dir">
  <nav>
    <button id="nav-semana" class="ativa" onclick="aba('semana')">Semana</button>
    <button id="nav-revisao" onclick="aba('revisao')">Revisão <span id="badge" class="badge" style="display:none"></span></button>
    <button id="nav-auto" onclick="aba('auto')">Automático <span id="badge-auto" class="badge" style="display:none">ligado</span></button>
  </nav>
  <button id="btn-tema" class="tema" onclick="alternarTema()" aria-label="Alternar modo escuro"></button>
  </div>
</header>
<main>
  <div id="msgs"></div>
  <section id="aba-semana"></section>
  <section id="aba-revisao" style="display:none"></section>
  <section id="aba-auto" style="display:none"></section>
</main>

<div id="fundo" class="fundo"><div class="modal" id="modal"></div></div>
<div id="carga" class="fundo carga" role="alertdialog" aria-live="polite" aria-labelledby="carga-tit"><div class="modal-carga"><h2 id="carga-tit">Gerando relatório</h2><div class="barra"><div id="carga-bar"></div></div><div class="carga-info"><span id="carga-etapa"></span><b id="carga-pct">0%</b></div><p class="suave" style="margin:14px 0 0">Isso pode levar alguns segundos. Não feche esta página.</p></div></div>

<script>
let semana = null, dadosSemana = null, rascunho = null;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmt = iso => iso ? iso.slice(8,10) + '/' + iso.slice(5,7) + '/' + iso.slice(0,4) : '';
function somar(iso, n) { const p = iso.split('-').map(Number); const d = new Date(Date.UTC(p[0], p[1]-1, p[2]+n)); return d.toISOString().slice(0,10); }
function chamar(fn, ...args) {
  return new Promise((ok, falha) => google.script.run.withSuccessHandler(r => r && r.ok === false ? falha(new Error(r.erro)) : ok(r ? r.dados : r))
    .withFailureHandler(e => falha(new Error(e && e.message ? e.message : e)))[fn](...args));
}
function msg(tipo, texto, fixo) { const d = document.createElement('div'); d.className = 'msg ' + tipo; d.innerHTML = texto; $('msgs').appendChild(d); if (!fixo) setTimeout(() => d.remove(), 12000); return d; }
function limparMsgs() { $('msgs').innerHTML = ''; }
function aba(nome) {
  ['semana','revisao','auto'].forEach(n => { $('aba-'+n).style.display = n === nome ? '' : 'none'; $('nav-'+n).classList.toggle('ativa', n === nome); });
  if (nome === 'revisao') carregarRevisao(); if (nome === 'auto') carregarAuto(); if (nome === 'semana') carregarSemana(semana, false);
}

// ------------------------------------------------------------ TEMA
function aplicarTema(t) {
  document.documentElement.setAttribute('data-theme', t);
  const b = $('btn-tema'); if (b) { b.textContent = t === 'dark' ? '☀️' : '🌙'; b.title = t === 'dark' ? 'Mudar para o modo claro' : 'Mudar para o modo escuro'; }
}
function alternarTema() {
  const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  aplicarTema(t); try { localStorage.setItem('tema', t); } catch (e) { /* ignora */ }
}
(function () {
  let t = null; try { t = localStorage.getItem('tema'); } catch (e) { /* ignora */ }
  if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  aplicarTema(t);
})();

// ------------------------------------------------------------ CARREGAMENTO (progresso estimado)
let cargaTimer = null, cargaPct = 0;
const ETAPAS = [[0, 'Buscando as avaliações…'], [25, 'Montando o relatório…'], [55, 'Gerando o PDF…'], [80, 'Gerando o Word e salvando na pasta…'], [93, 'Finalizando…']];
function cargaAtualizar() {
  $('carga-bar').style.width = cargaPct + '%'; $('carga-pct').textContent = Math.round(cargaPct) + '%';
  $('carga-etapa').textContent = cargaPct >= 100 ? 'Pronto!' : ETAPAS.filter(e => cargaPct >= e[0]).pop()[1];
}
function cargaIniciar(titulo) {
  clearInterval(cargaTimer); cargaPct = 0; $('carga-tit').textContent = titulo; cargaAtualizar(); $('carga').classList.add('aberto');
  cargaTimer = setInterval(() => { cargaPct = Math.min(95, cargaPct + (95 - cargaPct) * 0.04 + 0.1); cargaAtualizar(); }, 300);
}
function cargaFechar() { clearInterval(cargaTimer); $('carga').classList.remove('aberto'); }
async function cargaFim() { clearInterval(cargaTimer); cargaPct = 100; cargaAtualizar(); await new Promise(r => setTimeout(r, 450)); cargaFechar(); }

// ------------------------------------------------------------ SEMANA
async function carregarSemana(ini, aceitar) {
  limparMsgs();
  $('aba-semana').innerHTML = '<div class="card carregando">Atualizando o calendário e as avaliações…</div>';
  try { dadosSemana = await chamar('apiSemana', ini || null, !!aceitar); }
  catch (e) { $('aba-semana').innerHTML = ''; msg('erro', esc(e.message), true); return; }
  semana = dadosSemana.ini; desenharSemana(dadosSemana);
}
function desenharSemana(d) {
  d.erros.forEach((e, i) => msg('erro', esc(e) + (d.abortado && i === 0 ? ' <a href="#" onclick="carregarSemana(semana,true);return false">Aceitar a leitura mesmo assim</a>' : ''), true));
  if (d.mudancas.length) msg('ok', 'Calendário atualizado: ' + d.mudancas.map(m => esc(m.evento.toLowerCase() + (m.municipio ? ' ' + m.municipio : ''))).join(', ') + '.');
  if (d.n_revisar_semana) msg('aviso', d.n_revisar_semana + ' atividade(s) desta semana aguardam revisão e ainda não aparecem na lista. <a href="#" onclick="aba(\'revisao\');return false">Abrir a revisão</a>', true);
  marcarBadges(d.n_revisar);
  const MES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  const cards = d.grupos.map(g => {
    const of = g.tipo === 'Oficina', gk = esc(g.gkey).replace(/'/g, "\\'");
    const tot = g.gerencias.length;
    const feitos = g.gerencias.filter(x => x.status === 'Enviado' || x.status === 'Sem avaliações').length;
    const prog = !tot ? '' : feitos === tot ? 'completo' : feitos > 0 ? 'parcial' : '';
    const mods = g.modalidades.map(m => '<span class="tag mod">' + esc(m) + '</span>').join('');
    const gers = g.gerencias.map(x => {
      const env = x.status === 'Enviado', sem = x.status === 'Sem avaliações';
      const situ = env ? '<span class="tag ok">Enviado</span><div class="suave">' + esc(x.enviado_em) + ' · ' + esc(x.tipo_envio || '') + '</div>'
        : sem ? '<span class="tag sem">Sem avaliações</span><div class="suave">verificado em ' + esc(x.enviado_em) + '</div>'
        : '<span class="tag parc">Não enviado</span>' + (x.motivo ? '<div class="erro-t">' + esc(x.motivo) + '</div>' : '');
      const n = x.n === null ? '<span class="suave">—</span>' : '<b>' + x.n + '</b> <span class="suave">avaliações</span>';
      const links = [x.pdf ? '<a href="' + esc(x.pdf) + '" target="_blank">PDF</a>' : '', x.docx ? '<a href="' + esc(x.docx) + '" target="_blank">Word</a>' : ''].filter(Boolean).join(' · ');
      return '<li class="ger ' + (env ? 'enviado' : '') + '"><div class="nome">' + esc(x.ger) + '</div><div>' + n + '</div><div>' + situ + '</div><div>' + (links || '<span class="suave">—</span>') + '</div>'
        + '<div class="acao"><button class="b ' + (env ? 'sec' : '') + '" onclick="preparar(\'' + gk + '\',\'' + esc(x.ger).replace(/'/g, "\\'") + '\')">' + (env ? 'Reenviar' : 'Preparar envio') + '</button></div></li>';
    }).join('');
    const ge = g.geral, gEnv = !!ge && ge.status === 'Enviado';
    const geralLinks = ge ? [ge.pdf ? '<a href="' + esc(ge.pdf) + '" target="_blank">PDF</a>' : '', ge.docx ? '<a href="' + esc(ge.docx) + '" target="_blank">Word</a>' : ''].filter(Boolean).join(' · ') : '';
    const geral = '<li class="ger geral ' + (gEnv ? 'enviado' : '') + '"><div class="nome">Todas as gerências<div class="suave" style="font-weight:400">relatório geral, sem dividir por gerência</div></div>'
      + '<div>' + (g.total === null ? '<span class="suave">—</span>' : '<b>' + g.total + '</b> <span class="suave">avaliações</span>') + '</div>'
      + '<div>' + (gEnv ? '<span class="tag ok">Enviado</span><div class="suave">' + esc(ge.enviado_em) + ' · ' + esc(ge.tipo_envio || '') + '</div>' : '<span class="tag parc">Não enviado</span>') + '</div>'
      + '<div>' + (geralLinks || '<span class="suave">—</span>') + '</div>'
      + '<div class="acao"><button class="b sec" onclick="preparar(\'' + gk + '\',\'TODAS\')">' + (gEnv ? 'Reenviar geral' : 'Relatório geral') + '</button></div></li>';
    return '<article class="ativ ' + prog + '"><header class="ativ-topo">'
      + '<div class="data"><b>' + g.data.slice(8, 10) + '</b><span>' + MES[+g.data.slice(5, 7) - 1] + '</span><small>' + esc(g.dia) + '</small></div>'
      + '<div class="ativ-tit"><div class="tags">' + (of ? '<span class="tag of">Oficina</span>' : '') + mods + '</div>'
      + '<h3>' + (of ? esc(g.oficina) : esc(g.municipio)) + '</h3>' + (of ? '<div class="suave">' + esc(g.municipio) + '</div>' : '')
      + (tot ? '<div class="suave" style="margin-top:4px">' + feitos + ' de ' + tot + ' gerências concluídas</div>' : '') + '</div>'
      + '<div class="ativ-lado"><div class="tot">' + (g.total === null ? '<span class="suave">—</span>' : '<b>' + g.total + '</b><span class="suave">avaliações</span>') + '</div>'
      + (g.pasta ? '<a href="' + esc(g.pasta) + '" target="_blank">📁 PDF e Word</a>' : '')
      + '<label class="inline" title="Se marcado, o envio automático não envia esta atividade"><input type="checkbox" ' + (g.nao_auto ? 'checked ' : '') + 'onchange="naoAuto(\'' + gk + '\', this.checked)"> excluir do automático</label></div>'
      + '</header><ul class="gers">' + gers + geral + '</ul></article>';
  }).join('');
  $('aba-semana').innerHTML =
    '<section class="card"><div class="semana-barra"><button class="b sec" onclick="carregarSemana(somar(semana,-7))">◀ Semana anterior</button>'
    + '<div class="semana-titulo">Semana de ' + fmt(d.ini) + ' a ' + fmt(d.fim) + '</div>'
    + '<button class="b sec" onclick="carregarSemana(somar(semana,7))">Próxima semana ▶</button></div>'
    + '<div class="semana-ir"><label class="inline">Ir para a semana que contém <input type="date" id="irdata" value="' + d.ini + '" onchange="if(this.value)carregarSemana(this.value)"></label>'
    + '<button class="b sec" onclick="carregarSemana(null)">Semana atual</button><button class="b" onclick="carregarSemana(semana)" title="Consulta de novo o calendário e as respostas do formulário">↻ Atualizar</button></div></section>'
    + '<div class="sec-tit"><h2>Atividades da semana</h2>' + (d.grupos.length ? '<p class="suave">Cada atividade tem um relatório e um e-mail por gerência participante. Cada avaliação vai para a gerência da sua unidade/setor (tabela na planilha de controle).</p>' : '') + '</div>'
    + (d.grupos.length ? '<div class="lista">' + cards + '</div>' : '<div class="card"><p class="suave">Nenhuma atividade de segunda a sexta nesta semana.</p></div>')
    + '<p class="suave" style="margin-top:24px">' + (d.n_avisos ? d.n_avisos + ' aviso(s) na aba Revisão · ' : '') + (d.respostasOk ? 'Avaliações lidas do formulário.' : 'Avaliações indisponíveis agora.') + '</p>';
}
function marcarBadges(n) { $('badge').style.display = n ? '' : 'none'; $('badge').textContent = n; }
async function naoAuto(gkey, valor) { try { await chamar('apiNaoAuto', [gkey], valor); } catch (e) { msg('erro', esc(e.message)); } }

// ------------------------------------------------------------ ENVIO MANUAL
async function preparar(gkey, ger) {
  cargaIniciar('Preparando o envio: ' + (ger === 'TODAS' ? 'relatório geral' : ger));
  try { rascunho = await chamar('apiPreparar', gkey, ger, null); } catch (e) { cargaFechar(); return msg('erro', esc(e.message)); }
  await cargaFim(); abrirRascunho();
}
function abrirRascunho(aviso) {
  const p = rascunho;
  const of = p.tipo === 'Oficina';
  $('modal').innerHTML = '<h2>' + (of ? 'Oficina: ' + esc(p.oficina) + ' — ' : '') + esc(p.municipio) + ' — ' + fmt(p.data) + ' — ' + (p.geral ? 'Relatório geral' : esc(p.ger)) + '</h2>'
    + '<div class="suave">' + (of ? '' : 'Modalidade: <b>' + esc(p.modalidades.join(' e ')) + '</b> · ')
    + (p.geral ? 'Gerências participantes (todas constam no relatório): <b>' + esc(p.gerencias.join(', ')) + '</b>' : 'Gerência do relatório: <b>' + esc(p.ger) + '</b>') + '</div>'
    + '<div style="margin:6px 0">' + (p.geral ? 'Avaliações (todas, sem dividir por gerência): <b>' + p.total + '</b>' : 'Avaliações desta gerência: <b>' + p.total + '</b> (total da atividade: ' + p.totalAtividade + ')') + '</div>'
    + (aviso ? '<div class="msg ok">' + esc(aviso) + '</div>' : '')
    + p.avisos.map(a => '<div class="msg aviso">' + esc(a) + '</div>').join('')
    + (p.total ? '<label class="inline"><input type="checkbox" id="inc" ' + (p.incluirSeguinte ? 'checked ' : '') + 'onchange="regerar()"> Incluir avaliações do dia seguinte (se o município não tiver outra atividade nesse dia)</label>'
      + '<div style="margin:10px 0;display:flex;gap:8px;flex-wrap:wrap"><a class="b sec" href="' + esc(p.pdfUrl) + '" target="_blank">Abrir PDF</a>'
      + (p.docxUrl ? '<a class="b sec" href="' + esc(p.docxUrl) + '" target="_blank">Abrir Word</a>' : '')
      + (p.pastaUrl ? '<a class="b sec" href="' + esc(p.pastaUrl) + '" target="_blank">Pasta da atividade (PDF e Word)</a>' : '') + '</div>'
      + '<iframe src="' + esc(p.pdfUrl.replace(/\/view.*$/, '/preview')) + '"></iframe>'
      : '<div class="msg aviso">Nenhuma avaliação recebida. Se enviar, vai o aviso de "sem avaliações".</div>')
    + '<div class="grade"><div><label>Para</label><input type="text" id="e-para" value="' + esc(p.para) + '"></div>'
    + '<div><label>Cópia (CC)</label><input type="text" id="e-cc" value="' + esc(p.cc) + '"></div></div>'
    + '<label>Cópia oculta (CCO) — e-mails ' + (p.geral ? 'de todas as gerências participantes' : 'da gerência') + '</label><input type="text" id="e-cco" value="' + esc(p.cco) + '">'
    + '<label>Assunto</label><input type="text" id="e-assunto" value="' + esc(p.assunto) + '">'
    + '<label>Mensagem</label><textarea id="e-corpo">' + esc(p.corpo) + '</textarea>'
    + '<div class="suave" style="margin-top:6px">Remetente: ' + esc(p.remetente) + ' (se não estiver cadastrado em "Enviar e-mail como" no Gmail, o envio sai pela conta que hospeda o sistema).</div>'
    + '<div class="acoes"><button class="b" id="btn-env" onclick="enviar()">Enviar e-mail</button><button class="b sec" onclick="salvarRascunho()">Criar rascunho no Gmail</button><button class="b sec" onclick="fechar()">Fechar</button></div>';
  $('fundo').classList.add('aberto');
}
function lerCampos() { ['para','cc','cco','assunto','corpo'].forEach(k => rascunho[k] = $('e-' + k).value); }
function fechar() { $('fundo').classList.remove('aberto'); }
async function regerar() {
  lerCampos(); const inc = $('inc').checked;
  cargaIniciar('Atualizando o relatório');
  try { rascunho = await chamar('apiRegerar', rascunho, inc); await cargaFim(); abrirRascunho('Relatório atualizado.'); } catch (e) { cargaFechar(); msg('erro', esc(e.message)); }
}
async function enviar() {
  lerCampos();
  if (!confirm('Enviar o e-mail agora?')) return;
  $('btn-env').disabled = true;
  try {
    const r = await chamar('apiEnviar', rascunho); fechar();
    msg('ok', 'E-mail enviado' + (r.usado ? ' por ' + esc(r.usado) : '') + '.' + (r.aviso ? ' ' + esc(r.aviso) : ''), true);
    carregarSemana(semana);
  } catch (e) { $('btn-env').disabled = false; msg('erro', esc(e.message), true); }
}
async function salvarRascunho() { lerCampos(); try { await chamar('apiRascunho', rascunho); msg('ok', 'Rascunho criado no seu Gmail.'); } catch (e) { msg('erro', esc(e.message)); } }

// ------------------------------------------------------------ REVISÃO
async function carregarRevisao() {
  limparMsgs(); $('aba-revisao').innerHTML = '<div class="card carregando">Carregando…</div>';
  let d; try { d = await chamar('apiRevisao'); } catch (e) { $('aba-revisao').innerHTML = ''; return msg('erro', esc(e.message), true); }
  marcarBadges(d.itens.length);
  const itens = d.itens.map((a, i) => '<div class="revisar" id="rev-' + i + '">' + (a.tipo === 'Oficina' ? '<div><span class="tag of">Oficina</span></div><label>Nome da oficina</label><input type="text" class="r-of" value="' + esc(a.oficina) + '">' : '') + '<div class="suave"><b>Observação do calendário:</b> ' + esc(a.obs || '-') + ' · <b>Origem:</b> ' + esc(a.origem) + ' · <b>Processo:</b> ' + esc(a.proc || '-') + '</div>'
    + '<div class="grade"><div><label>Data</label><input type="date" class="r-data" value="' + a.data + '"></div>'
    + '<div><label>Município</label><input type="text" class="r-mun" list="lista-mun" value="' + esc(a.mun) + '"></div>'
    + '<div' + (a.tipo === 'Oficina' ? ' style="display:none"' : '') + '><label>Modalidade</label><select class="r-mod">' + d.modalidades.map(m => '<option' + (m === a.modalidade ? ' selected' : '') + '>' + m + '</option>').join('') + '</select></div></div>'
    + '<label>Gerências</label><div class="checks">' + d.gerencias.map(g => '<label class="inline"><input type="checkbox" class="r-ger" value="' + g + '"' + (a.ger.indexOf(g) >= 0 ? ' checked' : '') + '> ' + g + '</label>').join('') + '</div>'
    + '<button class="b" onclick="confirmarItem(' + i + ',\'' + esc(a.chave).replace(/'/g, "\\'") + '\')">Confirmar</button></div>').join('');
  const av = d.avisos.map(i => '<tr><td>' + esc(i.tipo) + '</td><td>' + esc(i.municipio) + '</td><td>' + esc(i.data) + '</td><td>' + esc(i.detalhe) + '</td></tr>').join('');
  $('aba-revisao').innerHTML = '<datalist id="lista-mun">' + d.municipios.map(m => '<option value="' + esc(m) + '">').join('') + '</datalist>'
    + '<section class="card"><h2>Atividades para revisar</h2><p class="suave">Vieram do calendário sem município reconhecido ou sem gerência válida. Corrija e confirme: só então entram na lista da semana. A correção vale enquanto o texto da célula no calendário não mudar.</p>'
    + (itens || '<p class="suave">Nada para revisar.</p>') + '</section>'
    + '<section class="card"><h2>Avisos' + (d.semanaAvisos ? ' da semana de ' + esc(d.semanaAvisos) : '') + '</h2><p class="suave">Somente leitura; atualizados cada vez que a aba Semana é aberta.</p>'
    + (av ? '<div style="overflow-x:auto"><table><thead><tr><th>Tipo</th><th>Município</th><th>Data</th><th>Detalhe</th></tr></thead><tbody>' + av + '</tbody></table></div>' : '<p class="suave">Nenhum aviso.</p>') + '</section>';
}
async function confirmarItem(i, chave) {
  const r = $('rev-' + i), f = { chave, data: r.querySelector('.r-data').value, municipio: r.querySelector('.r-mun').value, modalidade: r.querySelector('.r-mod').value, oficina: r.querySelector('.r-of') ? r.querySelector('.r-of').value : '',
    gerencias: [...r.querySelectorAll('.r-ger:checked')].map(c => c.value) };
  try { await chamar('apiConfirmar', f); await carregarRevisao(); msg('ok', 'Atividade confirmada: já aparece na lista da semana.'); } catch (e) { msg('erro', esc(e.message)); }
}

// ------------------------------------------------------------ AUTOMÁTICO
const ROTULO = { enviada: 'Enviado', teste: 'Teste enviado', enviaria: 'Enviaria', sem_avaliacoes: 'Sem avaliações', ignorada: 'Ignorada', nao_enviada: 'Não enviado', falha: 'Falha', ja_enviada: 'Já enviada' };
async function carregarAuto() {
  limparMsgs(); $('aba-auto').innerHTML = '<div class="card carregando">Carregando…</div>';
  let s; try { s = await chamar('apiAutomatico'); } catch (e) { $('aba-auto').innerHTML = ''; return msg('erro', esc(e.message), true); }
  $('badge-auto').style.display = s.ativo ? '' : 'none';
  const inconsistente = s.ativo && !s.gatilhos ? '<div class="msg erro">Está marcado como ligado, mas o gatilho não existe. Clique em Salvar para recriá-lo.</div>' : (!s.ativo && s.gatilhos ? '<div class="msg erro">Está desligado, mas ainda existe um gatilho. Clique em Salvar para removê-lo.</div>' : '');
  $('aba-auto').innerHTML = '<section class="card"><h2>Envio automático</h2>' + inconsistente
    + '<p class="suave">Roda de segunda a sexta, por volta do horário abaixo (o Google pode atrasar uns 15 minutos), e trata as atividades do <b>dia útil anterior</b> (na segunda, as de sexta). '
    + 'Envia só se a atividade não estiver em revisão, não estiver marcada como "excluir", ainda não tiver sido enviada e tiver ao menos 1 avaliação. Sem avaliações: nada é enviado, só fica registrado no painel.</p>'
    + '<label class="switch"><input type="checkbox" id="a-ativo" ' + (s.ativo ? 'checked' : '') + '> Envio automático ligado</label>'
    + '<div class="grade"><div><label>Hora (0–23)</label><input type="number" id="a-hora" min="0" max="23" value="' + s.hora + '"></div><div><label>Minuto aproximado (0–59)</label><input type="number" id="a-min" min="0" max="59" value="' + s.minuto + '"></div></div>'
    + '<label class="inline" style="margin-top:12px"><input type="checkbox" id="a-teste" ' + (s.teste ? 'checked' : '') + '> Modo teste (envia SÓ para o e-mail abaixo, com assunto [TESTE], e não marca nada como enviado)</label>'
    + '<label>E-mail do teste (vazio = a conta que hospeda o sistema)</label><input type="text" id="a-email" value="' + esc(s.emailTeste) + '">'
    + '<div class="acoes"><button class="b" onclick="salvarAuto()">Salvar</button></div>'
    + '<p class="suave">Envio real: Para <b>' + esc(s.para) + '</b>, com as gerências em CCO. ' + (s.teste ? '<b>Modo teste ligado: nada vai para as gerências.</b>' : '<b>Modo teste desligado: os e-mails irão para as gerências.</b>') + '</p>'
    + '<div class="msg ' + (s.remetente.disponivel ? 'ok' : 'aviso') + '">Remetente: ' + esc(s.remetente.texto) + '</div></section>'
    + '<section class="card"><h2>Testar agora</h2><p class="suave">Atividades do dia útil anterior a hoje: <b>' + fmt(s.alvoHoje) + '</b>.</p>'
    + '<div class="acoes"><button class="b sec" onclick="simular()">Simular (não envia nada)</button><button class="b" onclick="executarAgora()">Executar agora</button></div><div id="resultado-auto"></div></section>'
    + '<section class="card"><h2>Última execução</h2>' + (s.ultima ? tabelaExec(s.ultima) : '<p class="suave">Ainda não houve execução.</p>') + '</section>';
}
function tabelaExec(r) {
  const it = (r.itens || []).map(i => '<tr><td>' + esc(i.municipio) + '</td><td>' + esc(ROTULO[i.decisao] || i.decisao) + '</td><td>' + esc(i.total === undefined ? '' : i.total) + '</td><td>' + esc(i.motivo || '') + '</td></tr>').join('');
  return '<p class="suave">' + esc(r.quando || '') + (r.alvo ? ' · atividades de ' + fmt(r.alvo) : '') + (r.teste ? ' · <b>modo teste</b>' : '') + (r.simular ? ' · <b>simulação</b>' : '') + '</p>'
    + (r.erros || []).map(e => '<div class="msg erro">' + esc(e) + '</div>').join('')
    + (it ? '<table><thead><tr><th>Município</th><th>Resultado</th><th>Avaliações</th><th>Observação</th></tr></thead><tbody>' + it + '</tbody></table>' : '<p class="suave">Nenhuma atividade tratada.</p>');
}
async function salvarAuto() {
  const p = { ativo: $('a-ativo').checked, hora: $('a-hora').value, minuto: $('a-min').value, teste: $('a-teste').checked, emailTeste: $('a-email').value };
  if (p.ativo && !p.teste && !confirm('O MODO TESTE está desligado: os e-mails automáticos irão para as gerências. Continuar?')) return;
  try { await chamar('apiDefinirAutomatico', p); msg('ok', p.ativo ? 'Automático ligado.' : 'Automático desligado.'); carregarAuto(); } catch (e) { msg('erro', esc(e.message)); }
}
async function simular() { $('resultado-auto').innerHTML = '<p class="suave">Simulando…</p>'; try { $('resultado-auto').innerHTML = tabelaExec(await chamar('apiSimular')); } catch (e) { $('resultado-auto').innerHTML = ''; msg('erro', esc(e.message)); } }
async function executarAgora() {
  if (!confirm('Executar o automático agora? (Segue o modo teste: se estiver desligado, envia de verdade às gerências.)')) return;
  $('resultado-auto').innerHTML = '<p class="suave">Executando…</p>';
  try { $('resultado-auto').innerHTML = tabelaExec(await chamar('apiExecutarAgora')); } catch (e) { $('resultado-auto').innerHTML = ''; msg('erro', esc(e.message)); }
}

carregarSemana(null);
(async () => { try { const s = await chamar('apiAutomatico'); $('badge-auto').style.display = s.ativo ? '' : 'none'; } catch (e) { /* ignora */ } })();
</script>
